name: Android

# Android / Android TV 的 CI（M2）。
#
# 三个 job：
#   unit-test —— 纯 JVM 单测（路由顺序、帧率匹配、DV 探测、桥接 Range、Sup 切分）。
#                不需要 native，几分钟出结果，每个 PR 都跑。
#   apk       —— 装 NDK、还原 libmpv 缓存、编两个壳的 debug APK，并校验
#                16KB 页对齐（M2 头号风险：libmpv.so 必须是 0x4000 对齐）。
#                打 android-* 标签时不跑（标签只出发版包）。
#   release   —— 只在打标签时跑（android-phone-v* / android-tv-v*）：用仓库
#                Secrets 里的密钥签一个发版 APK，附到同名 Release 上。手机端和
#                TV 端各一条版本线，和桌面端的 0.1.x 也互不相干
#                （见 docs/M2-ANDROID.md §7.10）。
#
# libmpv 编译一次约 20–40 分钟，所以缓存 `build/android-mpv/arm64/prefix`
# （含 .so、头文件与 .done 标记）。key 只跟构建脚本走：改脚本 = 换产物。
# 首次运行（缓存未命中）会真的编一遍，之后都直接命中。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'docs/**'
      - 'android/**'
      - 'feat/**'
    # 路径过滤对 tag 不生效，下面的标签一定会触发（job 自己判断跑哪条）。
    tags:
      - 'android-phone-v*'
      - 'android-tv-v*'
    paths:
      - 'apps/android/**'
      - 'scripts/android/**'
      - 'core/**'
      - '.github/workflows/android.yml'
      - '.github/release-notes-android-phone.md'
      - '.github/release-notes-android-tv.md'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'scripts/android/**'
      - 'core/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # runner 在海外，直连官方仓库；开发机的阿里云镜像 / GitHub 代理都不设。
  DVPLAYER_MAVEN_MIRROR: ''
  DVPLAYER_GH_PROXY: ''

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 平台
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: 纯 JVM 单测
        working-directory: apps/android
        run: |
          ./gradlew \
            :player:testDebugUnitTest \
            :core:testDebugUnitTest \
            :player-media3:testDebugUnitTest \
            --console=plain

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            apps/android/*/build/reports/tests/
            apps/android/*/build/test-results/
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 标签只出发版包（见 release job），debug 包留给分支 / PR。
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: 安装 NDK r28 与 SDK 平台
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: 构建 libmpv 的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build autoconf automake libtool pkg-config bzip2 xz-utils \
            gperf
          pip3 install --user meson

      - uses: actions/cache@v4
        id: mpv-cache
        with:
          path: build/android-mpv/arm64/prefix
          key: libmpv-${{ runner.os }}-arm64-${{ hashFiles('scripts/android/build-mpv.sh', 'scripts/android/env.sh') }}
          restore-keys: |
            libmpv-${{ runner.os }}-arm64-

      # libdovi（Dolby Vision RPU 解析）是 Rust：要 cbindgen 生成头文件，
      # 还要 Android 的 std。开发机上都装着，runner 上得自己补。
      - name: 准备 libdovi 的 Rust 工具
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: |
          rustup target add aarch64-linux-android
          cargo install cbindgen --locked

      - name: 编译 libmpv（缓存未命中时）
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          JOBS="$(nproc)" scripts/android/build-mpv.sh --arch arm64 --stage

      - name: 还原产物到 jniLibs（缓存命中时）
        if: steps.mpv-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p apps/android/core/src/main/jniLibs/arm64-v8a \
                   apps/android/player-mpv/src/main/cpp/include/mpv
          cp build/android-mpv/arm64/prefix/lib/libmpv.so \
             apps/android/core/src/main/jniLibs/arm64-v8a/libmpv.so
          cp build/android-mpv/arm64/prefix/include/mpv/*.h \
             apps/android/player-mpv/src/main/cpp/include/mpv/

      - uses: gradle/actions/setup-gradle@v4

      # 核心是 Rust：APK 里的 libdvplayer_media_jni.so 就是 core/media 的 JNI 门面。
      # 不编它，APK 能装能起，但设置页永远「核心未加载」。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/*/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 编译原生核心（arm64-v8a）
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          ABIS=arm64-v8a PROFILE=release scripts/android/build-native.sh

      - name: 编译手机 + TV 壳
        working-directory: apps/android
        run: |
          ./gradlew :app-phone:assembleDebug :app-tv:assembleDebug --console=plain

      - name: 16KB 页与打包校验
        run: |
          scripts/android/check-apk.sh \
            apps/android/app-phone/build/outputs/apk/debug/app-phone-debug.apk
          scripts/android/check-apk.sh \
            apps/android/app-tv/build/outputs/apk/debug/app-tv-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app-*/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 发版：手机端和 TV 端分开打标签、分开出包、各自一条版本线。
  #
  #   android-phone-v0.1.0 → DVPlayer-Phone-0.1.0.apk → Release「Android 手机 0.1.0」
  #   android-tv-v0.1.0    → DVPlayer-TV-0.1.0.apk    → Release「Android TV 0.1.0」
  #
  # 两个端共用一个 job：构建步骤一样，只有模块、版本键、产物名和正文不同
  # （见「判定发的是哪个端」）。TV 界面还没做完，可以一直停在自己的 0.1.x。
  #
  # 签名密钥放仓库 Secrets（生成见 scripts/android/make-keystore.sh）：
  # 没有密钥就不出包——用 debug 密钥签出来的 APK 每次签名都不同，
  # 用户没法覆盖安装升级。
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: startsWith(github.ref, 'refs/tags/android-phone-v') || startsWith(github.ref, 'refs/tags/android-tv-v')
    needs: unit-test
    permissions:
      contents: write
    env:
      DVPLAYER_ANDROID_STORE_PASSWORD: ${{ secrets.DVPLAYER_ANDROID_STORE_PASSWORD }}
      DVPLAYER_ANDROID_KEY_ALIAS: ${{ secrets.DVPLAYER_ANDROID_KEY_ALIAS }}
      DVPLAYER_ANDROID_KEY_PASSWORD: ${{ secrets.DVPLAYER_ANDROID_KEY_PASSWORD }}
    steps:
      - name: 判定发的是哪个端
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            android-phone-v*) app=phone; module=app-phone; slug=Phone; label=手机
                              notes=.github/release-notes-android-phone.md ;;
            android-tv-v*)    app=tv;    module=app-tv;    slug=TV;    label=TV
                              notes=.github/release-notes-android-tv.md ;;
            *) echo "::error::标签 $GITHUB_REF_NAME 不是 android-phone-v* / android-tv-v*"; exit 1 ;;
          esac
          {
            echo "app=$app"
            echo "module=$module"
            echo "slug=$slug"
            echo "label=$label"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"
          echo "这次发的是 ${label}（:${module}）"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: 安装 NDK r28 与 SDK 平台
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: 构建 libmpv 的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build autoconf automake libtool pkg-config bzip2 xz-utils \
            gperf
          pip3 install --user meson

      - uses: actions/cache@v4
        id: mpv-cache
        with:
          path: build/android-mpv/arm64/prefix
          key: libmpv-${{ runner.os }}-arm64-${{ hashFiles('scripts/android/build-mpv.sh', 'scripts/android/env.sh') }}
          restore-keys: |
            libmpv-${{ runner.os }}-arm64-

      - name: 准备 libdovi 的 Rust 工具
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: |
          rustup target add aarch64-linux-android
          cargo install cbindgen --locked

      - name: 编译 libmpv（缓存未命中时）
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          JOBS="$(nproc)" scripts/android/build-mpv.sh --arch arm64 --stage

      - name: 还原产物到 jniLibs（缓存命中时）
        if: steps.mpv-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p apps/android/core/src/main/jniLibs/arm64-v8a \
                   apps/android/player-mpv/src/main/cpp/include/mpv
          cp build/android-mpv/arm64/prefix/lib/libmpv.so \
             apps/android/core/src/main/jniLibs/arm64-v8a/libmpv.so
          cp build/android-mpv/arm64/prefix/include/mpv/*.h \
             apps/android/player-mpv/src/main/cpp/include/mpv/

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/*/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 编译原生核心（arm64-v8a）
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          ABIS=arm64-v8a PROFILE=release scripts/android/build-native.sh

      - name: 取标签里的版本
        id: version
        run: |
          prefix="android-${{ steps.target.outputs.app }}-v"
          version="${GITHUB_REF_NAME#"$prefix"}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::标签 $GITHUB_REF_NAME 不是 ${prefix}<大>.<小>.<补丁>"
            exit 1
          fi
          # versionCode 必须递增：大*10000 + 小*100 + 补丁（0.1.0 → 100）。
          code=$(printf '%s' "$version" | awk -F. '{ printf "%d", $1 * 10000 + $2 * 100 + $3 }')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "${{ steps.target.outputs.label }} ${version}（versionCode ${code}）"

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.DVPLAYER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 DVPLAYER_ANDROID_KEYSTORE_BASE64（见 scripts/android/make-keystore.sh）"
            exit 1
          fi
          if [ -z "$DVPLAYER_ANDROID_STORE_PASSWORD" ] \
             || [ -z "$DVPLAYER_ANDROID_KEY_ALIAS" ] \
             || [ -z "$DVPLAYER_ANDROID_KEY_PASSWORD" ]; then
            echo "::error::签名密钥的密码 / 别名没配全（STORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD）"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          chmod 600 "$RUNNER_TEMP/keystore/release.jks"
          echo "DVPLAYER_ANDROID_KEYSTORE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: 编译发版 APK
        working-directory: apps/android
        env:
          APP: ${{ steps.target.outputs.app }}
          MODULE: ${{ steps.target.outputs.module }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew ":$MODULE:assembleRelease" \
            "-Pdvplayer.$APP.versionName=$VERSION" \
            "-Pdvplayer.$APP.versionCode=$CODE" \
            --console=plain

      - name: 校验版本、签名与 16KB 页
        env:
          MODULE: ${{ steps.target.outputs.module }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="apps/android/$MODULE/build/outputs/apk/release/$MODULE-release.apk"
          scripts/android/check-apk.sh "$apk"

          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          badging=$("$build_tools/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          case "$badging" in
            *"versionName='$VERSION'"*) ;;
            *) echo "::error::APK 里的版本不是 $VERSION"; exit 1 ;;
          esac

          certs=$("$build_tools/apksigner" verify --print-certs "$apk")
          echo "$certs" | head -3
          if printf '%s' "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK 用的是 debug 签名，发版密钥没生效"
            exit 1
          fi

      - name: 整理产物
        env:
          MODULE: ${{ steps.target.outputs.module }}
          SLUG: ${{ steps.target.outputs.slug }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out/android
          cp "apps/android/$MODULE/build/outputs/apk/release/$MODULE-release.apk" \
             "out/android/DVPlayer-$SLUG-$VERSION.apk"
          ls -lh out/android

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ steps.target.outputs.app }}
          path: out/android/*.apk
          if-no-files-found: error

      # 手机端和 TV 端是两个独立 Release：版本各走各的，正文也各写各的。
      # 不抢 latest：桌面端的最新版仍由 v* 的 Release 承担。
      - name: 附到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android ${{ steps.target.outputs.label }} ${{ steps.version.outputs.version }}
          body_path: ${{ steps.target.outputs.notes }}
          prerelease: true
          make_latest: false
          files: out/android/*.apk
