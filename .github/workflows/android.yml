name: Android

# Android / Android TV 的 CI（M2）。
#
# 两个 job：
#   unit-test —— 纯 JVM 单测（路由顺序、帧率匹配、DV 探测、桥接 Range、Sup 切分）。
#                不需要 native，几分钟出结果，每个 PR 都跑。
#   apk       —— 装 NDK、还原 libmpv 缓存、编两个壳的 debug APK，并校验
#                16KB 页对齐（M2 头号风险：libmpv.so 必须是 0x4000 对齐）。
#
# libmpv 编译一次约 20–40 分钟，所以缓存 `build/android-mpv/arm64/prefix`
# （含 .so、头文件与 .done 标记）。key 只跟构建脚本走：改脚本 = 换产物。
# 首次运行（缓存未命中）会真的编一遍，之后都直接命中。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'docs/**'
      - 'android/**'
      - 'feat/**'
    paths:
      - 'apps/android/**'
      - 'scripts/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'scripts/android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # runner 在海外，直连官方仓库；开发机的阿里云镜像 / GitHub 代理都不设。
  DVPLAYER_MAVEN_MIRROR: ''
  DVPLAYER_GH_PROXY: ''

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 SDK 平台
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: 纯 JVM 单测
        working-directory: apps/android
        run: |
          ./gradlew \
            :player:testDebugUnitTest \
            :core:testDebugUnitTest \
            :player-media3:testDebugUnitTest \
            --console=plain

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            apps/android/*/build/reports/tests/
            apps/android/*/build/test-results/
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 NDK r28 与 SDK 平台
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: 构建 libmpv 的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build autoconf automake libtool pkg-config bzip2 xz-utils
          pip3 install --user meson

      - uses: actions/cache@v4
        id: mpv-cache
        with:
          path: build/android-mpv/arm64/prefix
          key: libmpv-${{ runner.os }}-arm64-${{ hashFiles('scripts/android/build-mpv.sh', 'scripts/android/env.sh') }}
          restore-keys: |
            libmpv-${{ runner.os }}-arm64-

      - name: 编译 libmpv（缓存未命中时）
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          JOBS="$(nproc)" scripts/android/build-mpv.sh --arch arm64 --stage

      - name: 还原产物到 jniLibs（缓存命中时）
        if: steps.mpv-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p apps/android/core/src/main/jniLibs/arm64-v8a \
                   apps/android/player-mpv/src/main/cpp/include/mpv
          cp build/android-mpv/arm64/prefix/lib/libmpv.so \
             apps/android/core/src/main/jniLibs/arm64-v8a/libmpv.so
          cp build/android-mpv/arm64/prefix/include/mpv/*.h \
             apps/android/player-mpv/src/main/cpp/include/mpv/

      - uses: gradle/actions/setup-gradle@v4

      - name: 编译手机 + TV 壳
        working-directory: apps/android
        run: |
          ./gradlew :app-phone:assembleDebug :app-tv:assembleDebug --console=plain

      - name: 16KB 页与打包校验
        run: |
          scripts/android/check-apk.sh \
            apps/android/app-phone/build/outputs/apk/debug/app-phone-debug.apk
          scripts/android/check-apk.sh \
            apps/android/app-tv/build/outputs/apk/debug/app-tv-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app-*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
