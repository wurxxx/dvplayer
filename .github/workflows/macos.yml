name: macOS

# 显示名里带上架构和要附的 Release tag：手工补产物时靠它把 release_tag
# 原样传下去（workflow_dispatch 的输入不出现在运行记录里）。
run-name: macOS ${{ inputs.arch || 'both' }}${{ inputs.arch == 'arm64' && format('@{0}', inputs.arm_runner || 'macos-26') || '' }}${{ inputs.release_tag != '' && format(' release:{0}', inputs.release_tag) || '' }}

# 在 GitHub 托管的 macOS runner 上编 dmg + zip，两种架构各一个 job：
#   arm64（Apple Silicon）—— 跑 macos-26（arm64，也就是 macos-latest）
#   x86_64（Intel）      —— 跑 macos-15-intel
#
# 为什么 arm64 要放 CI：开发机是 Intel，交叉编译能出 arm64 产物但**无法运行
# 验证**。arm64 runner 是原生 Apple Silicon，能编也能跑冒烟测试。
#
# runner 标签的选择不是随便挑的，有明确的时间线（2026-11 查证）：
#   - macos-14 已于 2026-11-02 从 GitHub Actions 退役，写它直接失败
#   - macos-13 已于 2025-12-04 退役
#   - Intel 只剩 macos-15-intel / macos-26-intel，且 macos-15-intel
#     到 2027-08 结束，之后 Actions 不再提供 x86_64 macOS
#   - arm64 的 macos-15 池子长期排不到：v0.1.4 发版时连续两次都在排队满
#     15 分钟时被 GitHub 取消（2026-11-25，11:57 与 12:21 各一次，一步没跑），
#     所以 arm64 改用 macos-26（= macos-latest，池子更大、退役更晚）。
#     两者硬件一样（3 核 M1 / 7 GB），差别只在系统与 Xcode：15 是 SDK 15.x，
#     26 是 SDK 26.x —— 所以下面必须钉死 MACOSX_DEPLOYMENT_TARGET，不然
#     编译器会按 SDK 版本给依赖栈写上 minos 26.0，只能跑在 macOS 26 上。
#
# 源码就在这个仓库里。**不能**让 runner 去拉 Gitee：Gitee 官方有「海外用户
# 如何访问」专页，说明海外访问需要特殊 DNS，runner 在海外，直连会随机失败。
#
# 触发：
#   - 手动（Actions → macOS → Run workflow），可选只编一种架构
#   - 打 tag（v*）时自动出两种架构并附到 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用 Info.plist 里的）'
        required: false
        default: ''
      arch:
        description: '只编哪种架构'
        required: false
        default: both
        type: choice
        options:
          - both
          - arm64
          - x86_64
      release_tag:
        description: '产物附到这个 tag 的 Release（手工补产物时用；留空则看 github.ref）'
        required: false
        default: ''
      arm_runner:
        description: 'arm64 跑哪个 runner（容量不足时可以两个都排）'
        required: false
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-15
  push:
    tags:
      - 'v*'

# softprops/action-gh-release 要写 Release；仓库默认 token 可能只有只读权限。
permissions:
  contents: write

env:
  # 改了 mpv commit 或依赖版本时，把这个数字加一让缓存失效。
  # v2：加了部署目标 13.0 —— v1 缓存里的 dylib 是 minos 15.0，必须重编。
  DEPS_CACHE_KEY: v2

  # 产物最低支持 macOS 13（和 apps/macos/DvPlayer/Info.plist 的
  # LSMinimumSystemVersion、Package.swift 的 .macOS(.v13) 对齐）。
  #
  # 不写的话 clang 按 **SDK 版本**取默认值：在 macos-15 上编出来是 15.0，
  # 在 macos-26 上编出来是 26.0 —— v0.1.4 的 x86_64 包就是这么中招的，
  # App 本体写着 13.0，附带的 libav*/libmpv/libplacebo 却是 15.0，
  # macOS 13/14 上直接加载失败。这里显式钉死，并在依赖栈编完后校验。
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  # 先算出这次要编哪些架构。
  #
  # 为什么不直接在 build 的 matrix 里写死两个、再用 job 级 `if` 过滤：
  # `matrix` 上下文在 `jobs.<job_id>.if` 里**不可用**（那里只有 github /
  # needs / vars / inputs），写了会报 Unrecognized named-value。
  # 所以用一个几秒钟的 prepare job 把矩阵算好传过去。
  prepare:
    name: 选择架构
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # push（tag）触发时 inputs.arch 为空，当成 both。
          WANT='${{ inputs.arch }}'
          [[ -z "$WANT" ]] && WANT=both

          # arm64 跑哪个镜像可以由输入指定：两个 arm64 池子（macos-26 / macos-15）
          # 都可能一时没机器，多排一张票就是多一次抽签。
          ARM_RUNNER='${{ inputs.arm_runner }}'
          [[ -z "$ARM_RUNNER" ]] && ARM_RUNNER=macos-26
          ARM="{\"arch\":\"arm64\",\"runner\":\"$ARM_RUNNER\"}"
          INTEL='{"arch":"x86_64","runner":"macos-15-intel"}'

          case "$WANT" in
            both)   echo "matrix={\"include\":[$ARM,$INTEL]}" >> "$GITHUB_OUTPUT" ;;
            arm64)  echo "matrix={\"include\":[$ARM]}" >> "$GITHUB_OUTPUT" ;;
            x86_64) echo "matrix={\"include\":[$INTEL]}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::未知架构 '$WANT'"; exit 1 ;;
          esac
          echo "本次要编：$WANT"

  # Release 正文只在这个 job 里写一次。
  #
  # 以前三个打包 job（macOS 两种架构 + Windows）各自开了
  # generate_release_notes，同一个 Release 被写三次，正文里就叠了三份
  # changelog（v0.1.4 叠了四份）。现在打包 job 只传文件、不带正文，
  # 正文 = .github/release-notes.md（手写的主要修复）+ 自动变更列表。
  #
  # 放在 macOS 工作流里是因为 push tag 时它一定会跑；Windows 工作流
  # 只负责附文件。手工补产物（指定 release_tag）时这里会把同样的正文
  # 再写一遍，内容是覆盖而不是追加，不会重复。
  notes:
    name: 写 Release 说明
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          body_path: .github/release-notes.md
          # 手写正文在前，GitHub 生成的「What's Changed」和唯一的
          # Full Changelog 链接在后。
          generate_release_notes: true

  build:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    strategy:
      # 一种架构挂了不要取消另一种：Intel 和 arm64 的依赖栈互不影响，
      # 让两边都跑完，才能一次看到全部问题。
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 报告运行环境
        run: |
          set -euo pipefail
          echo "runner 标签: ${{ matrix.runner }}"
          echo "目标架构:    ${{ matrix.arch }}"
          echo "实际架构:    $(uname -m)"
          sw_vers
          echo "---"
          xcodebuild -version
          echo "---"
          brew --prefix

      - name: 校验 runner 架构与目标一致
        run: |
          set -euo pipefail
          # 防呆：如果 runner 标签写错（比如把 Intel 包编在 arm64 上），
          # 依赖栈会编出错误架构的库，最后才在产物校验那里失败，白等 40 分钟。
          # 这里提前失败。
          HOST="$(uname -m)"
          if [[ "$HOST" != "${{ matrix.arch }}" ]]; then
            echo "::error::runner 是 $HOST，但目标是 ${{ matrix.arch }}（标签 ${{ matrix.runner }}）"
            exit 1
          fi
          echo "架构一致：$HOST"

      - name: 装构建工具
        run: |
          set -euo pipefail
          # meson / ninja / nasm：编 ffmpeg、libplacebo、mpv 用
          brew install meson ninja nasm pkg-config

          # libass 的依赖（build-deps 脚本不编它们，从 Homebrew 拿）。
          brew install fribidi harfbuzz fontconfig freetype jpeg

          # Rust 工具链：编 core（共享媒体库）
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          # 让后续步骤也能找到 cargo（rustup 默认装在 ~/.cargo/bin）。
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # runner 预装的 Rust 有时不在 PATH 里；这里先确认能用，别等下一步才炸。
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version

      - name: 缓存依赖栈（还原）
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          # 只缓存 prefix（编好的 dylib + 头文件），不缓存源码树：
          # build/src 有几个 GB，而且 ffmpeg 的 config.h 残留会让下次
          # configure 直接跳过、编出架构不对的东西。
          # key 里带 arch，两种架构的库不能混用。
          path: prefix
          key: deps-${{ env.DEPS_CACHE_KEY }}-${{ runner.os }}-${{ matrix.arch }}

      - name: 编依赖栈（ffmpeg / libplacebo / libass / mpv）
        run: |
          set -euo pipefail
          # 缓存命中时脚本内部会各自跳过（按 prefix/lib/pkgconfig/*.pc 判断）。
          # 首次约 40-60 分钟。
          if ! JOBS=$(sysctl -n hw.ncpu) ./scripts/build-deps-macos.sh 2>&1 | tee "$RUNNER_TEMP/deps.log"; then
            echo "::error::依赖栈编译失败"
            tail -80 "$RUNNER_TEMP/deps.log"
            exit 1
          fi

      - name: 校验依赖栈的最低系统版本
        # 部署目标写错很隐蔽：包在编译机上能跑，发给 macOS 13/14 用户却
        # 起不来。这里直接读每个 dylib 的 LC_BUILD_VERSION → minos。
        run: |
          set -euo pipefail
          BAD=0
          for f in prefix/lib/libavcodec*.dylib prefix/lib/libavformat*.dylib \
                   prefix/lib/libmpv*.dylib prefix/lib/libplacebo*.dylib \
                   prefix/lib/libass*.dylib; do
            minos=$(xcrun vtool -show-build "$f" | awk '/minos/{print $2; exit}')
            printf '%-40s minos %s\n' "$(basename "$f")" "${minos:-?}"
            if [[ "${minos:-}" != "$MACOSX_DEPLOYMENT_TARGET" ]]; then BAD=1; fi
          done
          if [[ "$BAD" -ne 0 ]]; then
            echo "::error::有 dylib 的 minos 不是 $MACOSX_DEPLOYMENT_TARGET"
            exit 1
          fi

      - name: 缓存依赖栈（保存）
        # 显式保存：以前靠 actions/cache 的后置步骤，job 一旦在后面（比如打包）
        # 失败，这一步会被跳过，下次又得从零编 40 分钟。依赖栈编完就存下来。
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: prefix
          key: deps-${{ env.DEPS_CACHE_KEY }}-${{ runner.os }}-${{ matrix.arch }}

      - name: 编 Rust 核心
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
          # workspace 根在 core/ 下，仓库根没有 Cargo.toml。
          # 这里以前少了 cd core，cargo 直接报
          #   error: could not find `Cargo.toml` in ... or any parent directory
          # 并 exit 101。因为更早的步骤先失败过，这一步从没真正跑起来，
          # 所以一直没暴露。
          cd core
          cargo build -p dvplayer-media --release

      - name: 编 App 并打包
        env:
          VERSION_INPUT: ${{ inputs.version }}
          # 弹幕（弹弹play）凭据：仓库 Settings → Secrets 里配了才会注入，
          # 没配就是空值，打出来的包不带弹幕（本地打包走 ~/.config/dvplayer/danmaku.env）。
          DVPLAYER_DANMAKU_APP_ID: ${{ secrets.DVPLAYER_DANMAKU_APP_ID }}
          DVPLAYER_DANMAKU_APP_SECRET: ${{ secrets.DVPLAYER_DANMAKU_APP_SECRET }}
          # Trakt 应用凭据：只配 Client ID 就能用（PKCE 应用没有 secret）；
          # 没配的话设置页会显示 Client ID 输入框，让用户填自己的应用。
          DVPLAYER_TRAKT_CLIENT_ID: ${{ secrets.DVPLAYER_TRAKT_CLIENT_ID }}
          DVPLAYER_TRAKT_CLIENT_SECRET: ${{ secrets.DVPLAYER_TRAKT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # 不要用 `ARGS=(); ... "${ARGS[@]}"`：macOS 自带的 /bin/bash 是 3.2，
          # 空数组在 set -u 下展开会报 `ARGS[@]: unbound variable`
          # （bash 4.4 才修好）。这里直接分两个分支。
          if [[ -n "${VERSION_INPUT:-}" ]]; then
            ./apps/macos/packaging/build-release.sh -Version "$VERSION_INPUT"
          else
            ./apps/macos/packaging/build-release.sh
          fi

      - name: 检查产物架构
        run: |
          set -euo pipefail
          DMG=$(ls out/release/*.dmg | head -1)
          echo "产物: $DMG"

          MP=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | tail -1)
          APP="$MP/DV Player.app"

          echo "--- 主程序"
          lipo -archs "$APP/Contents/MacOS/DvPlayer"

          echo "--- Frameworks"
          for f in "$APP/Contents/Frameworks/"*.dylib; do
            printf '%-45s %s\n' "$(basename "$f")" "$(lipo -archs "$f")"
          done

          # 任何一个不是目标架构就让构建失败，别把混架构的包发出去。
          BAD=0
          for f in "$APP/Contents/MacOS/DvPlayer" "$APP/Contents/Frameworks/"*.dylib; do
            if ! lipo -archs "$f" | grep -qw "${{ matrix.arch }}"; then
              echo "::error file=$f::不是 ${{ matrix.arch }}（$(lipo -archs "$f")）"
              BAD=1
            fi
          done

          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil detach "$MP" -force || true
          exit $BAD

      - name: 启动冒烟测试
        run: |
          set -euo pipefail
          DMG=$(ls out/release/*.dmg | head -1)
          MP=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | tail -1)
          APP="$MP/DV Player.app"

          # 用自检入口：打开首页、截一张图、退出。
          # 能走到截图就说明 SwiftUI 起来了、libmpv 也加载了。
          OUT="$RUNNER_TEMP/smoke.jpg"
          rm -f "$OUT"
          DVPLAYER_PAGE=home \
          DVPLAYER_SHOT="$OUT" \
          DVPLAYER_SHOT_DELAY=12 \
          DVPLAYER_EXIT=1 \
            "$APP/Contents/MacOS/DvPlayer" 2>&1 | tee "$RUNNER_TEMP/smoke.log" || true

          hdiutil detach "$MP" -force || true

          if [[ ! -s "$OUT" ]]; then
            echo "::error::冒烟测试失败：没有产出截图"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          fi
          echo "冒烟测试通过，截图 $(du -h "$OUT" | cut -f1)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          # 两种架构的 artifact 名不同，否则会互相覆盖。
          name: macos-${{ matrix.arch }}
          path: |
            out/release/*.dmg
            out/release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 附到 Release（tag 触发，或显式指定了 release_tag）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # 手工补产物时在别的分支/commit 上重跑，不能靠
          # github.ref 判断目标 Release，改由输入指定。
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            out/release/*.dmg
            out/release/*.zip
          # 正文只能由 release-notes job 提供。这里再开 generate_release_notes
          # 的话，正文里会多出一份 changelog（v0.1.5 就叠了三份）。
