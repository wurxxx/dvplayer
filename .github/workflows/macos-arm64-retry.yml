name: macOS arm64 排队重试

# 为什么需要它：GitHub 托管的 macOS **arm64** 机器从 2026-11 起长期容量不足。
# 排队抢不到机器时，job 会在满 15 分钟时被自动取消，日志里只有
#   The job was not acquired by Runner of type hosted even after multiple attempts
# 一步都不会跑。官方在 actions/runner-images#15291 里确认是容量问题、没有 ETA，
# 并且说「重跑通常能偶到一台可用的机器」（有人试了 7 次）。
# 换标签（macos-15 / macos-26 / macos-latest）没用，都在同一批 arm64 池子里。
#
# 所以这里做自动重试：macOS 工作流没成功、且 arm64 job 一步没跑（被取消）时，
# 自动再发一次 arm64 构建；上限按「最近一次成功之后连续失败 12 次」算。
# 真编失败（有步骤跑过）不重试——那不是容量问题。
#
# 注意：重试在 master 上编，用的是 master 当前代码。发起重试时 master 如果已经
# 越过待发布的 tag，就应该改发新版本，而不是继续拿这个 tag 的号。

on:
  workflow_run:
    workflows: ["macOS"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  # 同一时间只允许一个重试动作，避免几次取消同时到达时连发好几个构建。
  group: macos-arm64-retry
  cancel-in-progress: false

jobs:
  retry:
    # 注意别写成 conclusion == 'cancelled'：arm64 job 抢不到机器被取消时，
    # 运行记录的结论可能是 failure（prepare 成功 + 一个 cancelled job 聚合），
    # 真正该看的判据是「arm64 job 被取消且一步没跑」，下面 gate 里查。
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 判断是不是「抢不到机器」被取消
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail

          # 只认 arm64 job 被取消、且 steps 为空的情况。
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name=="macOS arm64") | "\(.conclusion // "none") \(.steps | length)"' | head -1)
          if [[ -z "$info" ]]; then
            echo "这次运行里没有 arm64 job（比如只编了 x86_64），跳过"
            exit 0
          fi
          read -r CONCL STEPS <<< "$info"
          echo "arm64 job：conclusion=$CONCL steps=$STEPS"
          if [[ "$CONCL" != "cancelled" || "$STEPS" != "0" ]]; then
            echo "不是排队被取消（真失败或已经跑过步骤），不重试"
            exit 0
          fi

          # 次数上限：只数「最近一次成功之后」连续没成功了几次。
          # （早先写成「最近 50 次里失败的条数」，把仓库历史里的失败也算进来，
          #   一上来就是 14 次，直接把闸拉死了。）
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/macos.yml/runs?per_page=50" \
            --jq '[.workflow_runs[].conclusion] | (index("success") // length)')
          echo "最近一次成功之后，连续没成功：$n 次"
          if (( n > 12 )); then
            echo "已到重试上限（12 次），停手等 GitHub 容量恢复；产物缺失请手工处理"
            exit 0
          fi

          # tag 触发的运行才需要往 Release 里补产物。
          # 两条来源：
          #   1) push tag：head_branch 就是 tag 名；
          #   2) 上一次是手工/重试触发：从显示名里的 `release:vX.Y.Z` 取回来。
          TAG=""
          if [[ "$RUN_EVENT" == "push" && "$HEAD_BRANCH" =~ ^v[0-9] ]]; then
            TAG="$HEAD_BRANCH"
          elif [[ "$TITLE" =~ release:(v[0-9][^[:space:]]*) ]]; then
            TAG="${BASH_REMATCH[1]}"
          fi
          echo "retry=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将重试 arm64，release_tag=${TAG:-（无）}"

      - name: 重新触发 arm64 构建
        if: steps.gate.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.gate.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run macos.yml --ref master -f arch=arm64 -f "release_tag=$TAG"
          echo "已重新触发：arch=arm64 release_tag=${TAG:-（无）}"
