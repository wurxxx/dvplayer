org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Android 的版本号独立于桌面端（Info.plist / csproj 里的 0.1.x），手机端和 TV 端
# 也各走各的：TV 界面还没做完，不能跟着手机一起涨。
# 默认值只给本机构建用；发版时 CI 从 android-phone-v* / android-tv-v* 标签取值，
# 用 -P 覆盖。versionCode 必须递增，规则是 大*10000+小*100+补丁（0.1.0 → 100），
# 由 scripts/android/bump-version.sh 一起写。
dvplayer.phone.versionName=0.1.0
dvplayer.phone.versionCode=100
dvplayer.tv.versionName=0.1.0
dvplayer.tv.versionCode=100
